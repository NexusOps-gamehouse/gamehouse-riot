name: riot-ci-cd

# feature/* → develop PR 시 검증, develop merge 시 이미지 publish.
#
# [모노레포 때와 달라진 것]
#   before  서비스 5개 matrix, postgres·rabbitmq 서비스 컨테이너, 컨텍스트가 backend/
#   after   riot 하나만. riot 은 테이블도 이벤트도 쓰지 않아 DB·브로커가 필요 없다.
#           대신 common 을 GitHub Packages 에서 받아오므로 인증이 필요하다.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  IMAGE_REPO: gamehouse
  SERVICE: riot
  MGMT_PORT: 8184

jobs:
  # ---------------------------------------------------------------
  # [PR 게이트 1] Secret scan
  # merge 후에는 히스토리에 남아 되돌리기 어려우므로 PR 시점에 돌린다.
  # ---------------------------------------------------------------
  verify:
    name: verify (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose

  # ---------------------------------------------------------------
  # [PR 게이트 2] 이미지 빌드 + 실제 기동
  # Dockerfile 이 jlink 로 JRE 를 조립하므로 모듈이 빠지면
  # 빌드는 통과하고 "실행할 때만" NoClassDefFound 가 난다.
  # ---------------------------------------------------------------
  image-check:
    name: image-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # BuildKit secret 으로 넘길 자격증명 파일.
      #
      # common 은 gamehouse-common 레포가 소유한 패키지라, 이 레포의 워크플로가
      # 읽으려면 둘 중 하나가 필요하다.
      #
      #   A) 패키지 설정 → Manage Actions access 에 이 레포를 Read 로 추가
      #      → 아래 GITHUB_TOKEN 으로 읽힌다 (PAT 불필요, 만료 없음)
      #   B) 조직 secret GPR_TOKEN (classic PAT, read:packages)
      #
      # 둘 중 뭐가 있든 동작하도록 GPR_TOKEN 을 우선하고 없으면 GITHUB_TOKEN 으로
      # 넘어간다. 둘 다 없으면 401 Unauthorized 로 죽는다.
      - name: Write GPR credentials
        run: |
          printf 'gpr.user=%s\ngpr.key=%s\n' \
            "${{ github.actor }}" \
            "${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}" > gradle.properties.ci

      # 패키지를 실제로 읽을 수 있는지 먼저 확인한다.
      #
      # 이게 없으면 Docker 빌드를 5분 돌린 뒤에야 401 을 보게 된다.
      # 여기서 죽으면 원인이 셋 중 하나다.
      #   - GPR_TOKEN 이 비어 있음
      #   - PAT 가 fine-grained (Packages 레지스트리는 classic 이라야 확실하다)
      #   - read:packages 스코프 누락 또는 조직 PAT 정책 차단
      - name: Check package access
        run: |
          if [ -z "${{ secrets.GPR_TOKEN }}" ]; then
            echo "GPR_TOKEN : 비어 있음 → GITHUB_TOKEN 으로 시도"
          else
            echo "GPR_TOKEN : 설정됨"
          fi

          # -L 이 필요하다. GitHub Packages 는 인증이 통과하면 실제 파일이 있는
          # objects.githubusercontent.com 으로 302 리다이렉트한다.
          # 안 따라가면 302 에서 멈춰 실패로 오인한다.
          code=$(curl -sL -o /dev/null -w '%{http_code}' \
            -u "${{ github.actor }}:${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}" \
            https://maven.pkg.github.com/NexusOps-gamehouse/gamehouse-common/gg/duo/common/0.1.0/common-0.1.0.pom)

          echo "common-0.1.0.pom => HTTP ${code}"
          case "${code}" in
            200) echo "패키지 읽기 OK" ;;
            401) echo "::error::401 Unauthorized — 토큰이 유효하지 않다 (fine-grained PAT 이거나 read:packages 누락)"; exit 1 ;;
            403) echo "::error::403 Forbidden — 조직 PAT 정책 또는 패키지 접근 권한 문제"; exit 1 ;;
            404) echo "::error::404 Not Found — 패키지 좌표가 다르다 (artifactId/version 확인)"; exit 1 ;;
            *)   echo "::error::예상치 못한 응답 ${code}"; exit 1 ;;
          esac

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gamehouse-riot:ci
          secret-files: |
            gpr=gradle.properties.ci
          cache-from: type=gha,scope=riot
          cache-to: type=gha,mode=max,scope=riot

      # riot 은 DB·브로커를 쓰지 않으므로 JWT_SECRET 만 있으면 뜬다.
      - name: Smoke test running container
        run: |
          docker run -d --name gh-ci-riot --network host \
            -e JWT_SECRET=ci-only-throwaway-secret-key-do-not-use-in-prod \
            gamehouse-riot:ci

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:${{ env.MGMT_PORT }}/actuator/health || echo 000)
            if [ "${code}" = "200" ]; then
              echo "HTTP 200 - riot is up"
              ok=1
              break
            fi
            echo "waiting... (attempt ${i}, last code=${code})"
            sleep 2
          done

          if [ "${ok}" != "1" ]; then
            echo "::error::riot did not become healthy within 60s"
            docker logs --tail=200 gh-ci-riot
            exit 1
          fi

      # 토큰이 이미지에 남지 않았는지 확인한다.
      - name: Assert no credential leaked into image
        run: |
          if docker history --no-trunc gamehouse-riot:ci | grep -qi 'ghp_\|gpr.key'; then
            echo "::error::credential found in image layers"
            exit 1
          fi
          echo "no credential in image layers"

      - name: Clean up
        if: always()
        run: docker rm -f gh-ci-riot || true

  # ---------------------------------------------------------------
  # [publish] develop merge 이후에만
  # 태그는 모노레포 때와 같게 유지한다 — infra 의 compose 와 k8s 매니페스트가
  # 이 이름을 보고 있어서 바꾸면 배포가 끊긴다.
  # ---------------------------------------------------------------
  publish:
    name: publish
    needs: [verify, image-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Docker Hub 자격증명 형식 점검.
      #
      # 값이 틀리면 401 이 나지만, 개행이나 공백이 섞이면
      #   Error response from daemon: ... unknown: malformed HTTP Authorization header
      # 로 죽는다. login-action 이 값을 base64 로 헤더에 넣는데 개행이 그걸 깨뜨린다.
      # 조직 secret 입력란에 붙여넣고 Enter 를 누르면 개행이 저장된다.
      - name: Check Docker Hub credentials format
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          fail=0
          [ -n "$DH_USER" ]  || { echo "::error::DOCKERHUB_USERNAME 이 비어 있다"; fail=1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::DOCKERHUB_TOKEN 이 비어 있다"; fail=1; }

          echo "username 길이: ${#DH_USER}   token 길이: ${#DH_TOKEN}"

          # 개행 / 공백 / 탭이 들어갔는지
          case "$DH_USER" in
            *[[:space:]]*) echo "::error::DOCKERHUB_USERNAME 에 공백이나 개행이 있다"; fail=1 ;;
          esac
          case "$DH_TOKEN" in
            *[[:space:]]*) echo "::error::DOCKERHUB_TOKEN 에 공백이나 개행이 있다"; fail=1 ;;
          esac

          [ "$fail" = "0" ] || exit 1
          echo "형식 OK"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write GPR credentials
        run: |
          printf 'gpr.user=%s\ngpr.key=%s\n' \
            "${{ github.actor }}" \
            "${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}" > gradle.properties.ci

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          secret-files: |
            gpr=gradle.properties.ci
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:riot-develop
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:riot-${{ github.sha }}
          cache-from: type=gha,scope=riot
          cache-to: type=gha,mode=max,scope=riot
