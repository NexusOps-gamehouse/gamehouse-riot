name: riot-ci-cd

# feature/* → develop PR 시 검증, develop merge 시 이미지 publish.
#
# [모노레포 때와 달라진 것]
#   before  서비스 5개 matrix, postgres·rabbitmq 서비스 컨테이너, 컨텍스트가 backend/
#   after   riot 하나만. riot 은 테이블도 이벤트도 쓰지 않아 DB·브로커가 필요 없다.
#           대신 common 을 GitHub Packages 에서 받아오므로 인증이 필요하다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read
  id-token: write

env:
  IMAGE_REPO: gamehouse
  SERVICE: riot
  MGMT_PORT: 8184

jobs:
  # ---------------------------------------------------------------
  # [PR 게이트 1] Secret scan
  # merge 후에는 히스토리에 남아 되돌리기 어려우므로 PR 시점에 돌린다.
  # ---------------------------------------------------------------
  verify:
    name: verify (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose

  # ---------------------------------------------------------------
  # [PR 게이트 2] 이미지 빌드 + 실제 기동
  # Dockerfile 이 jlink 로 JRE 를 조립하므로 모듈이 빠지면
  # 빌드는 통과하고 "실행할 때만" NoClassDefFound 가 난다.
  # ---------------------------------------------------------------
  image-check:
    name: image-check
    # main push 는 승격만 하므로 이미지를 다시 만들 필요가 없다.
    # PR 검증과 develop push 에서만 돈다.
    if: github.event_name == 'pull_request' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # BuildKit secret 으로 넘길 자격증명 파일.
      #
      # common 은 gamehouse-common 레포가 소유한 패키지라, 이 레포의 워크플로가
      # 읽으려면 둘 중 하나가 필요하다.
      #
      #   A) 패키지 설정 → Manage Actions access 에 이 레포를 Read 로 추가
      #      → 아래 GITHUB_TOKEN 으로 읽힌다 (PAT 불필요, 만료 없음)
      #   B) 조직 secret GPR_TOKEN (classic PAT, read:packages)
      #
      # 둘 중 뭐가 있든 동작하도록 GPR_TOKEN 을 우선하고 없으면 GITHUB_TOKEN 으로
      # 넘어간다. 둘 다 없으면 401 Unauthorized 로 죽는다.
      - name: Write GPR credentials
        run: |
          printf 'gpr.user=%s\ngpr.key=%s\n' \
            "${{ github.actor }}" \
            "${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}" > gradle.properties.ci

      # 패키지를 실제로 읽을 수 있는지 먼저 확인한다.
      #
      # 이게 없으면 Docker 빌드를 5분 돌린 뒤에야 401 을 보게 된다.
      # 여기서 죽으면 원인이 셋 중 하나다.
      #   - GPR_TOKEN 이 비어 있음
      #   - PAT 가 fine-grained (Packages 레지스트리는 classic 이라야 확실하다)
      #   - read:packages 스코프 누락 또는 조직 PAT 정책 차단
      - name: Check package access
        run: |
          if [ -z "${{ secrets.GPR_TOKEN }}" ]; then
            echo "GPR_TOKEN : 비어 있음 → GITHUB_TOKEN 으로 시도"
          else
            echo "GPR_TOKEN : 설정됨"
          fi

          # -L 이 필요하다. GitHub Packages 는 인증이 통과하면 실제 파일이 있는
          # objects.githubusercontent.com 으로 302 리다이렉트한다.
          # 안 따라가면 302 에서 멈춰 실패로 오인한다.
          code=$(curl -sL -o /dev/null -w '%{http_code}' \
            -u "${{ github.actor }}:${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}" \
            https://maven.pkg.github.com/NexusOps-gamehouse/gamehouse-common/gg/duo/common/0.1.0/common-0.1.0.pom)

          echo "common-0.1.0.pom => HTTP ${code}"
          case "${code}" in
            200) echo "패키지 읽기 OK" ;;
            401) echo "::error::401 Unauthorized — 토큰이 유효하지 않다 (fine-grained PAT 이거나 read:packages 누락)"; exit 1 ;;
            403) echo "::error::403 Forbidden — 조직 PAT 정책 또는 패키지 접근 권한 문제"; exit 1 ;;
            404) echo "::error::404 Not Found — 패키지 좌표가 다르다 (artifactId/version 확인)"; exit 1 ;;
            *)   echo "::error::예상치 못한 응답 ${code}"; exit 1 ;;
          esac

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gamehouse-riot:ci
          secret-files: |
            gpr=gradle.properties.ci
          cache-from: type=gha,scope=riot
          cache-to: type=gha,mode=max,scope=riot

      # riot 은 DB·브로커를 쓰지 않으므로 JWT_SECRET 만 있으면 뜬다.
      - name: Smoke test running container
        run: |
          docker run -d --name gh-ci-riot --network host \
            -e JWT_SECRET=ci-only-throwaway-secret-key-do-not-use-in-prod \
            gamehouse-riot:ci

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:${{ env.MGMT_PORT }}/actuator/health || echo 000)
            if [ "${code}" = "200" ]; then
              echo "HTTP 200 - riot is up"
              ok=1
              break
            fi
            echo "waiting... (attempt ${i}, last code=${code})"
            sleep 2
          done

          if [ "${ok}" != "1" ]; then
            echo "::error::riot did not become healthy within 60s"
            docker logs --tail=200 gh-ci-riot
            exit 1
          fi

      # 토큰이 이미지에 남지 않았는지 확인한다.
      - name: Assert no credential leaked into image
        run: |
          if docker history --no-trunc gamehouse-riot:ci | grep -qi 'ghp_\|gpr.key'; then
            echo "::error::credential found in image layers"
            exit 1
          fi
          echo "no credential in image layers"

      - name: Clean up
        if: always()
        run: docker rm -f gh-ci-riot || true

  # ---------------------------------------------------------------
  # [publish] develop merge 이후에만
  # 태그는 모노레포 때와 같게 유지한다 — infra 의 compose 와 k8s 매니페스트가
  # 이 이름을 보고 있어서 바꾸면 배포가 끊긴다.
  # ---------------------------------------------------------------
  publish:
    name: publish
    needs: [verify, image-check]
    # develop push 에서만 빌드한다. main 은 아래 promote 잡이
    # 이 결과물에 태그만 붙인다 — 같은 소스를 두 번 빌드하지 않는다.
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # OIDC 로 AWS 에 인증하려면 이 권한이 필요하다.
    # id-token: write 가 없으면 GitHub 이 토큰을 발급하지 않아
    # "Credentials could not be loaded" 로 죽는다. 가장 흔한 실수다.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # [Docker Hub 때와 달라진 것]
      #   before  액세스 키를 GitHub secret 에 저장 → 장기 자격증명이 남는다
      #   after   GitHub 이 서명한 토큰을 AWS 가 확인하고 이 실행에만 유효한
      #           임시 자격증명을 발급한다. 저장되는 비밀이 없다.
      #
      # 역할 ARN 은 조직 secret AWS_ROLE_ARN 에 둔다.
      # 값 자체가 기밀은 아니지만 이 레포들이 public 이라 계정 ID 를 굳이
      # 노출하지 않는다. 계정이나 역할 이름이 바뀌어도 secret 하나만 고치면
      # 6개 레포가 함께 따라간다.
      #
      # 리전은 코드에 그대로 둔다 — 바뀔 일이 거의 없고, secret 이 늘수록
      # "왜 실패했지" 의 후보가 늘어난다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Write GPR credentials
        run: |
          printf 'gpr.user=%s\ngpr.key=%s\n' \
            "${{ github.actor }}" \
            "${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}" > gradle.properties.ci

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64

          # attestation 을 끈다. 켜두면 ECR 에 image index + 본체 + 증명서로 3개가
          # 올라가 화면과 lifecycle 계산이 헷갈린다. amd64 단일이라 index 가 필요 없다.
          provenance: false
          sbom: false

          secret-files: |
            gpr=gradle.properties.ci

          # 브랜치 이름 = "그 브랜치의 지금 최신", SHA = "정확히 이 커밋" → 롤백 기준.
          #
          # ⚠️ 브랜치를 하드코딩하지 말 것. :develop 으로 고정하면 main 에서 돈
          #    이미지가 develop 태그를 덮어써 어느 브랜치 것인지 구분이 사라진다.
          # SHA 태그에 dev- 접두사를 붙인다. 접두사가 없으면 콘솔 태그 목록에서
          # 어느 SHA 가 develop 것이고 어느 게 main 승격분인지 구분되지 않는다.
          # 접미사가 아니라 접두사인 이유: ECR 수명 주기 정책의 tagPrefixList 가
          # 접두사 기준이라, 나중에 "dev- 태그는 N개만 유지" 같은 규칙을 걸기 쉽다.
          # develop/main 브랜치 태그는 형식을 바꾸지 않는다 — k8s overlay 가
          # newTag: develop 로 이 태그를 직접 참조한다.
          tags: |
            ${{ steps.ecr.outputs.registry }}/gamehouse-riot:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/gamehouse-riot:dev-${{ github.sha }}

          cache-from: type=gha,scope=riot
          cache-to: type=gha,mode=max,scope=riot

      # infra 저장소에 "이 커밋 이미지가 준비됐다"고 알린다.
      # 태그를 고치고 커밋하는 것은 infra 의 image-tag-writeback 워크플로가 한다.
      #
      # 보내는 값은 셋뿐이다. ECR 주소도 매니페스트 경로도 보내지 않는다 —
      # 그건 infra 가 소유한다. sha 는 접두사 없는 40자리이고, 태그는 받는 쪽이
      # <env>-<sha> 로 조립한다.
      #
      # 기본 GITHUB_TOKEN 은 이 레포 밖으로 나갈 수 없어 조직 secret 을 쓴다.
      # gh api 는 2xx 가 아니면 종료 코드가 0이 아니라, 인증 실패(401)를
      # 성공으로 넘기지 않는다.
      #
      # ⚠️ infra 의 수신 워크플로는 기본 브랜치(main)에서만 찾아진다.
      #    거기 없으면 204 를 받고 아무 일도 일어나지 않는다.
      - name: Notify infra (dev)
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TO_INFRA_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          gh api repos/NexusOps-gamehouse/infra/dispatches \
            -f event_type=image-published \
            -f "client_payload[service]=${SERVICE}" \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[env]=dev"

          echo "infra 에 알림: ${SERVICE} / dev-${SHA}"

  # ---------------------------------------------------------------
  # main 승격 — 다시 빌드하지 않는다.
  #
  # 같은 소스를 두 번 빌드하면 결과가 달라질 수 있다. jar 안에 빌드 시각이
  # 박히고, base 이미지(eclipse-temurin:17-jdk, debian:bookworm-slim)가
  # 떠다니는 태그라 며칠 사이에 내용이 바뀌기 때문이다. 그러면 dev 에서
  # 검증한 바이너리와 prod 에 올라간 바이너리가 달라진다 —
  # "dev 에서는 됐는데 prod 에서만 터진다" 의 원인이 된다.
  #
  # 그래서 빌드는 develop 에서 한 번만 하고, main 은 그 결과물에 태그만
  # 추가로 붙인다(build once, promote). 새 이미지가 생기지 않으므로
  # ECR 에는 한 digest 에 develop·main 태그가 함께 붙는다 — 그게 정상이다.
  # ---------------------------------------------------------------
  promote:
    name: promote (develop → main)
    needs: [verify]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # put-image 도 OIDC 로 인증한다. publish 잡과 같은 이유로 id-token 이 필요하다.
    permissions:
      contents: read
      id-token: write

    steps:
      # 머지 커밋의 2번째 부모 = 머지된 develop 쪽 커밋.
      # 그 SHA 로 태그된 이미지가 ECR 에 있으므로 승격 대상을 추측이 아니라
      # 특정할 수 있다. develop 태그를 그냥 쓰면 머지 이후 develop 이 앞서갔을 때
      # 엉뚱한 이미지를 승격하게 된다.
      #
      # ⚠️ fetch-depth 기본값은 1 이라 부모를 읽지 못한다. 2 가 필요하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 필요 권한: ecr:BatchGetImage (매니페스트 읽기), ecr:PutImage (태그 붙이기).
      # PutImage 는 docker push 에도 쓰이므로 이미 있을 것이고, BatchGetImage 가
      # 빠져 있으면 여기서 AccessDeniedException 으로 즉시 드러난다.
      - name: Retag develop image as main
        env:
          REPO: gamehouse-riot
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if SRC=$(git rev-parse --verify -q "HEAD^2"); then
            echo "머지 커밋 감지 — 승격 대상 커밋: ${SRC}"
            ID="imageTag=dev-${SRC}"
          else
            echo "::warning::dev-<sha> 태그를 특정하지 못했다 — 머지 커밋이 아니거나(스쿼시/fast-forward), 접두사 도입 이전에 빌드된 이미지다."
            echo "::warning::develop 태그로 폴백한다."
            ID="imageTag=develop"
          fi

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$REPO" \
            --image-ids "$ID" \
            --query 'images[0].imageManifest' --output text)

          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::ECR 에서 승격할 이미지를 찾지 못했다 (${ID})."
            echo "::error::develop 빌드가 성공했는지, 그 커밋의 SHA 태그가 있는지 확인한다."
            exit 1
          fi

          # 같은 매니페스트에 태그만 추가한다 — 이미지 본체는 새로 저장되지 않는다.
          # 이미 그 태그가 같은 이미지에 붙어 있으면 ImageAlreadyExistsException 이
          # 나는데, 원하는 상태와 같으므로 실패로 보지 않는다.
          for TAG in main "main-$MAIN_SHA"; do
            if aws ecr put-image --repository-name "$REPO" \
                 --image-tag "$TAG" --image-manifest "$MANIFEST" >/dev/null 2>&1; then
              echo "  태그 완료: ${REPO}:${TAG}"
            else
              echo "  ${REPO}:${TAG} — 이미 같은 이미지에 붙어 있다 (변경 없음)"
            fi
          done

      # 승격도 알린다. 여기를 빼면 dev 만 자동화되고 운영은 계속 손으로 태그를 적게 된다.
      #
      # 보내는 sha 는 main 의 커밋(github.sha)이다. 위에서 승격 대상을 찾을 때 쓴
      # HEAD^2(머지된 develop 쪽 커밋)가 아니다 — ECR 에 붙는 태그가 main-$MAIN_SHA
      # 이므로 매니페스트도 그것을 가리켜야 한다.
      - name: Notify infra (main)
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TO_INFRA_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          gh api repos/NexusOps-gamehouse/infra/dispatches \
            -f event_type=image-published \
            -f "client_payload[service]=${SERVICE}" \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[env]=main"

          echo "infra 에 알림: ${SERVICE} / main-${SHA}"
